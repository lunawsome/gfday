<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy National Girlfriend's Day ❤️</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- Background -->

<div class="background"></div>

<!-- Sparkles -->
<div id="sparkles"></div>

<!-- Flower Container -->
<div id="flowers"></div>

<!-- Gift Section -->

<section id="giftSection">

    <img
        src="giftbox.PNG"
        id="giftBox"
        draggable="false"
    >

    <p class="tapText">
        Tap the Gift 🎁
    </p>

</section>


<!-- Envelope -->

<section id="envelopeSection">

    <img
        src="env.PNG"
        id="envelope"
        draggable="false"
    >

    <p class="tapText">
        Tap the Envelope 💌
    </p>

</section>



<!-- Letter -->

<section id="letterSection">

    <div id="letterContainer">

        <img
            src="letter.JPEG"
            id="letterBG"
        >

        <div id="letterText">

            <h1>
                Happy National Girlfriend's Day ❤️
            </h1>

            <p>

                Hi Hon,

                <br><br>

                Replace this with your own letter.

                <br><br>

                I love you so much.
                Thank you for always making me happy.

                <br><br>

                Love,

                <br>

                Luna ❤️

            </p>

        </div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
