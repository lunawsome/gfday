<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Cielo ❤️</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}



html,body{

width:100%;
height:100%;
overflow:hidden;

font-family:'Poppins',sans-serif;

}




/* BACKGROUND */

.background{

position:fixed;

inset:0;

background:url("bg.JPEG");

background-size:cover;

background-position:center;

z-index:-10;

}





/* FLOWERS */


#flowerContainer{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:30;

}




.flower{

position:absolute;

opacity:0;

transform:
translate(-50%,-50%)
scale(.1);

}





/* GIFT */


#giftSection{

position:absolute;

top:50%;

left:50%;


transform:
translate(-50%,-50%);


display:flex;

flex-direction:column;

align-items:center;


z-index:20;

}



#giftBox{

width:240px;

cursor:pointer;

user-select:none;


animation:
giftFloat 2s infinite ease-in-out;


transition:1s;

}




#giftBox.open{


animation:none;


transform:
scale(1.15);


filter:
drop-shadow(0 0 40px pink);


}




@keyframes giftFloat{


0%,100%{

transform:translateY(0);

}


50%{

transform:translateY(-18px);

}


}





#giftText{


margin-top:20px;


color:white;


font-size:22px;


font-weight:600;



text-shadow:

0 0 10px hotpink,

0 0 20px hotpink;


}







/* FLOWER MESSAGE */


#flowerMessage{


position:fixed;


top:75%;


left:50%;


transform:
translate(-50%,-50%);



font-family:'Great Vibes',cursive;


font-size:40px;


color:white;


opacity:0;


z-index:60;



text-shadow:

0 0 15px pink,

0 0 30px pink;



transition:1s;

}





/* ENVELOPE */


#envelopeSection{


position:fixed;


inset:0;


display:none;


flex-direction:column;


justify-content:center;


align-items:center;



opacity:0;


z-index:50;


transition:1s;


}





#envelope{


width:220px;


cursor:pointer;


animation:
envelopeFloat 2.5s infinite ease-in-out;



transition:1s;


}




@keyframes envelopeFloat{


0%,100%{

transform:translateY(0);

}


50%{

transform:translateY(-15px);

}


}






#envelopeText{


margin-top:20px;


color:white;


font-size:20px;


font-weight:600;



text-shadow:

0 0 10px pink,

0 0 20px pink;


}






/* LETTER */


#letterSection{


position:fixed;


inset:0;



display:none;


justify-content:center;


align-items:center;



background:
rgba(0,0,0,.45);



opacity:0;


z-index:100;


transition:1s;


}





#letterCard{


position:relative;


width:90%;


max-width:700px;



transform:
translateY(250px)
scale(.7);



opacity:0;



transition:
1s cubic-bezier(.18,.89,.32,1.28);


}




#letterCard.show{


transform:
translateY(0)
scale(1);



opacity:1;


}



#letterImage{


width:100%;


display:block;


border-radius:20px;



box-shadow:

0 20px 50px rgba(0,0,0,.4);


}




#letterContent{


position:absolute;


inset:0;



display:flex;


flex-direction:column;


justify-content:center;


align-items:center;


text-align:center;



padding:60px;


}




#letterContent h1{


font-family:'Great Vibes',cursive;


font-size:55px;


color:#ff2e87;


text-shadow:

0 0 10px white;


}




#letterContent p{


margin-top:25px;


max-width:80%;


font-size:22px;


line-height:1.7;


color:#444;


}






@media(max-width:600px){


#giftBox{

width:160px;

}


#envelope{

width:160px;

}


#flowerMessage{

font-size:30px;

}


#letterContent{

padding:30px;

}


#letterContent h1{

font-size:32px;

}


#letterContent p{

font-size:16px;

}


}



</style>

</head>


<body>


<div class="background"></div>


<div id="flowerContainer"></div>



<div id="giftSection">


<img
id="giftBox"
src="giftbox.png"
alt="Gift">


<p id="giftText">
Open your surprise 🎁
</p>


</div>




<div id="flowerMessage">

Flowers for you 🌹

</div>



<div id="envelopeSection">


<img
id="envelope"
src="envelope.PNG"
alt="Envelope">


<p id="envelopeText">

A letter for you 💌

</p>


</div>



<div id="letterSection">


<div id="letterCard">


<img
id="letterImage"
src="letter.PNG">



<div id="letterContent">


<h1>
Happy National Girlfriend's Day ❤️
</h1>


<p>
Forever grateful to have you as my girlfriend.
I love you so much, hon.
</p>


</div>


</div>


</div>

<script>


// =========================
// ELEMENTS
// =========================

const giftBox = document.getElementById("giftBox");
const giftSection = document.getElementById("giftSection");

const flowerContainer = document.getElementById("flowerContainer");
const flowerMessage = document.getElementById("flowerMessage");

const envelopeSection = document.getElementById("envelopeSection");
const envelope = document.getElementById("envelope");

const letterSection = document.getElementById("letterSection");
const letterCard = document.getElementById("letterCard");



let opened = false;



// =========================
// FLOWERS
// =========================

const flowerImages = [

"F1.png",
"F2.png",
"F3.png",
"F4.png",
"F5.png",
"F6.png",
"F7.png",
"F8.png",
"F9.png",
"F10.png",
"F11.png"

];





// =========================
// SPARKLES
// =========================

function createSparkles(x,y){


for(let i=0;i<35;i++){


const spark=document.createElement("div");


spark.style.position="fixed";

spark.style.left=x+"px";

spark.style.top=y+"px";


spark.style.width=
(4+Math.random()*6)+"px";


spark.style.height=
spark.style.width;


spark.style.borderRadius="50%";


spark.style.background="white";


spark.style.boxShadow=
"0 0 15px white";


spark.style.zIndex="200";


document.body.appendChild(spark);



let angle =
Math.random()*Math.PI*2;


let distance =
80+Math.random()*180;



requestAnimationFrame(()=>{


spark.style.transition=
"all 1s ease-out";


spark.style.transform=
`
translate(
${Math.cos(angle)*distance}px,
${Math.sin(angle)*distance}px
)
`;


spark.style.opacity="0";


});



setTimeout(()=>{

spark.remove();

},1000);



}


}







// =========================
// CLICK GIFT
// =========================


giftBox.addEventListener("click",()=>{


if(opened)return;


opened=true;


giftBox.classList.add("open");


giftBox.src="giftboxopen.PNG";



const rect =
giftBox.getBoundingClientRect();



createSparkles(

rect.left+rect.width/2,

rect.top+rect.height/3

);



explodeFlowers();




setTimeout(()=>{

flowerMessage.style.opacity="1";

},1200);




setTimeout(()=>{

flowerMessage.style.opacity="0";

},3000);




setTimeout(()=>{

hideGift();

},3500);




setTimeout(()=>{

showEnvelope();

},4500);



});






// =========================
// FLOWER EXPLOSION
// =========================


function explodeFlowers(){


const rect =
giftBox.getBoundingClientRect();



const startX =
rect.left + rect.width/2;


const startY =
rect.top + rect.height*.3;




for(let i=0;i<130;i++){



const flower =
document.createElement("img");



flower.className="flower";



flower.src =
flowerImages[
Math.floor(
Math.random()*flowerImages.length
)
];



flower.style.left=startX+"px";


flower.style.top=startY+"px";



flower.style.width=
(40+Math.random()*60)+"px";



flowerContainer.appendChild(flower);



const angle =
Math.random()*Math.PI*2;



const distance =
300+Math.random()*700;




requestAnimationFrame(()=>{


flower.style.transition=
"all 2.5s cubic-bezier(.18,.89,.32,1.28)";



flower.style.transform=
`
translate(
${Math.cos(angle)*distance}px,
${Math.sin(angle)*distance-250}px
)

rotate(${Math.random()*720}deg)

scale(1.5)
`;



flower.style.opacity="1";



});




setTimeout(()=>{


flower.style.opacity="0";


},2500);




setTimeout(()=>{


flower.remove();


},3500);



}


}






// =========================
// HIDE GIFT
// =========================


function hideGift(){


giftSection.style.transition="1s";


giftSection.style.opacity="0";


giftSection.style.transform=
"translate(-50%,-50%) scale(.3)";



setTimeout(()=>{


giftSection.style.display="none";


},1000);



}






// =========================
// SHOW ENVELOPE
// =========================


function showEnvelope(){


envelopeSection.style.display="flex";



setTimeout(()=>{


envelopeSection.style.opacity="1";


},100);



}







// =========================
// ENVELOPE CLICK
// =========================


envelope.addEventListener("click",()=>{


envelope.style.transform=
"scale(.2) rotate(20deg)";


envelope.style.opacity="0";



setTimeout(()=>{


envelopeSection.style.display="none";


showLetter();



},800);



});







// =========================
// SHOW LETTER
// =========================


function showLetter(){


letterSection.style.display="flex";



setTimeout(()=>{


letterSection.style.opacity="1";


},100);



setTimeout(()=>{


letterCard.classList.add("show");


heartBurst();


},400);



}







// =========================
// HEART BURST
// =========================


function heartBurst(){


for(let i=0;i<25;i++){



const heart=document.createElement("div");


heart.innerHTML="❤";


heart.style.position="fixed";


heart.style.left="50%";


heart.style.top="50%";


heart.style.fontSize=
"25px";


heart.style.color="hotpink";


heart.style.zIndex="300";


document.body.appendChild(heart);



const x =
(Math.random()-.5)*400;


const y =
(Math.random()-.5)*400;




requestAnimationFrame(()=>{


heart.style.transition=
"2s ease-out";


heart.style.transform=
`
translate(${x}px,${y}px)
scale(1.5)
`;



heart.style.opacity="0";


});



setTimeout(()=>{


heart.remove();


},2000);



}


}



</script>


</body>

</html>
