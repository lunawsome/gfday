<style>
    /* =========================
RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:'Poppins',sans-serif;

}




/* =========================
BACKGROUND
========================= */


.background{

    position:fixed;

    inset:0;

    background:url("bg.JPEG");

    background-size:cover;

    background-position:center;

    z-index:-10;

}







/* =========================
FLOWER CONTAINER
========================= */


#flowerContainer{

    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:30;

}




.flower{

    position:absolute;

    opacity:0;

    transform:
    translate(-50%,-50%)
    scale(.1);

    will-change:transform,opacity;

}








/* =========================
GIFT
========================= */


#giftSection{

    position:absolute;

    top:50%;

    left:50%;


    transform:
    translate(-50%,-50%);


    display:flex;

    flex-direction:column;

    align-items:center;


    z-index:20;

}





#giftBox{

    width:240px;

    cursor:pointer;

    user-select:none;


    animation:
    giftFloat 2s infinite ease-in-out;


    transition:1s;

}




#giftBox.open{


    animation:none;


    transform:
    scale(1.15);


    filter:
    drop-shadow(0 0 40px pink);

}





@keyframes giftFloat{


    0%,100%{

        transform:translateY(0);

    }


    50%{

        transform:translateY(-18px);

    }


}






#giftText{


    margin-top:20px;


    color:white;


    font-size:22px;


    font-weight:600;


    text-shadow:

    0 0 10px hotpink,

    0 0 20px hotpink;


}







/* =========================
FLOWER MESSAGE
========================= */


#flowerMessage{


    position:fixed;


    top:70%;


    left:50%;


    transform:
    translate(-50%,-50%);


    color:white;


    font-size:35px;


    font-family:'Great Vibes',cursive;


    opacity:0;


    z-index:60;


    text-shadow:

    0 0 15px pink,

    0 0 30px pink;


    transition:1s;

}







/* =========================
ENVELOPE
========================= */


#envelopeSection{


    position:fixed;


    inset:0;


    display:none;


    flex-direction:column;


    justify-content:center;


    align-items:center;


    opacity:0;


    z-index:50;


    transition:1s;

}






#envelope{


    width:220px;


    cursor:pointer;


    animation:
    envelopeFloat 2.5s infinite ease-in-out;


    transition:1s;


}





@keyframes envelopeFloat{


    0%,100%{

        transform:translateY(0);

    }


    50%{

        transform:translateY(-15px);

    }


}






#envelopeText{


    margin-top:20px;


    color:white;


    font-size:20px;


    font-weight:600;


    text-shadow:

    0 0 10px pink,

    0 0 20px pink;


}









/* =========================
LETTER
========================= */


#letterSection{


    position:fixed;


    inset:0;


    display:none;


    justify-content:center;


    align-items:center;


    background:
    rgba(0,0,0,.45);


    opacity:0;


    z-index:100;


    transition:1s;

}






#letterCard{


    position:relative;


    width:90%;


    max-width:700px;


    transform:
    translateY(250px)
    scale(.7);


    opacity:0;


    transition:
    1s cubic-bezier(.18,.89,.32,1.28);


}







#letterCard.show{


    transform:
    translateY(0)
    scale(1);


    opacity:1;

}





#letterImage{


    width:100%;


    display:block;


    border-radius:20px;


    box-shadow:

    0 20px 50px rgba(0,0,0,.4);

}





#letterContent{


    position:absolute;


    inset:0;


    display:flex;


    flex-direction:column;


    justify-content:center;


    align-items:center;


    text-align:center;


    padding:60px;


}







#letterContent h1{


    font-family:'Great Vibes',cursive;


    font-size:55px;


    color:#ff2e87;


    text-shadow:

    0 0 10px white;


}







#letterContent p{


    margin-top:25px;


    max-width:80%;


    font-size:22px;


    line-height:1.7;


    color:#444;


}








/* =========================
MOBILE
========================= */


@media(max-width:600px){


    #giftBox{

        width:160px;

    }



    #flowerMessage{

        font-size:30px;

    }



    #envelope{

        width:160px;

    }



    #letterContent{

        padding:30px;

    }



    #letterContent h1{

        font-size:32px;

    }



    #letterContent p{

        font-size:16px;

    }


}
</style>
