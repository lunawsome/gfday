<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title></title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">


<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:'Poppins',sans-serif;

}




/* BACKGROUND */

.background{

    position:fixed;

    inset:0;

    background:url("bg.JPEG");

    background-size:cover;

    background-position:center;

    z-index:-10;

}




/* FLOWER CONTAINER */

#flowerContainer{

    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:20;

}




.flower{

    position:absolute;

    opacity:0;

    transform:
    translate(-50%,-50%)
    scale(.05);

}





/* GIFT */

#giftSection{

    position:absolute;

    top:50%;

    left:50%;


    transform:
    translate(-50%,-50%);


    display:flex;

    flex-direction:column;

    align-items:center;


    z-index:10;

}




#giftBox{

    width:180px;

    cursor:pointer;

    user-select:none;


    animation:
    floatGift 2s infinite ease-in-out;

}




@keyframes floatGift{


0%,100%{

    transform:translateY(0);

}


50%{

    transform:translateY(-15px);

}


}




#giftText{

    margin-top:18px;


    color:white;


    font-family:'Great Vibes',cursive;


    font-size:45px;


    text-shadow:

    0 0 10px pink,

    0 0 25px pink;

}



</style>

</head>


<body>


<div class="background"></div>


<div id="flowerContainer"></div>



<div id="giftSection">


<img
id="giftBox"
src="giftbox.png"
alt="Gift Box">


<p id="giftText">

For Cielo ❤️

</p>


</div>

<!-- =========================
ENVELOPE
========================= -->


<div id="envelopeSection">


<img
id="envelope"
src="env.PNG"
alt="Envelope">


<p id="envelopeText">

A letter for you 💌

</p>


</div>





<!-- =========================
LETTER
========================= -->


<div id="letterSection">


<div id="letterCard">


<img
id="letterImage"
src="letter.JPEG"
alt="Letter">



<div id="letterContent">


<h1>

Happy National Girlfriend's Day ❤️

</h1>



<p>

Forever grateful to have you as my girlfriend.
I love you so much, hon.

</p>


</div>


</div>


</div>





<style>


/* =========================
ENVELOPE
========================= */


#envelopeSection{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;


    opacity:0;

    z-index:50;

    transition:1s;

}




#envelope{

    width:200px;

    cursor:pointer;

    animation:
    envelopeFloat 2s infinite ease-in-out;

}



@keyframes envelopeFloat{


0%,100%{

    transform:translateY(0);

}


50%{

    transform:translateY(-15px);

}


}




#envelopeText{

    margin-top:20px;


    color:white;


    font-size:22px;


    font-weight:600;


    text-shadow:

    0 0 10px pink,

    0 0 20px pink;


}






/* =========================
LETTER
========================= */


#letterSection{

    position:fixed;

    inset:0;


    display:none;


    justify-content:center;

    align-items:center;


    background:rgba(0,0,0,.45);


    opacity:0;


    z-index:100;


    transition:1s;


}




#letterCard{

    width:90%;

    max-width:700px;


    position:relative;


    transform:

    translateY(250px)

    scale(.6);


    opacity:0;


    transition:

    1s cubic-bezier(.18,.89,.32,1.28);


}




#letterCard.show{


    transform:

    translateY(0)

    scale(1);


    opacity:1;


}





#letterImage{


    width:100%;


    display:block;


    border-radius:20px;


    box-shadow:

    0 20px 50px rgba(0,0,0,.4);


}





#letterContent{


    position:absolute;


    inset:0;


    display:flex;


    flex-direction:column;


    justify-content:center;


    align-items:center;


    text-align:center;


    padding:50px;


}





#letterContent h1{


    font-family:'Great Vibes',cursive;


    font-size:55px;


    color:#ff2e87;


}





#letterContent p{


    margin-top:20px;


    max-width:80%;


    font-size:22px;


    color:#444;


    line-height:1.7;


}





@media(max-width:600px){


#giftBox{

    width:150px;

}


#giftText{

    font-size:38px;

}


#envelope{

    width:160px;

}


#letterContent h1{

    font-size:32px;

}


#letterContent p{

    font-size:16px;

}


}


</style>

<script>


// =========================
// ELEMENTS
// =========================


const giftBox = document.getElementById("giftBox");

const giftSection = document.getElementById("giftSection");

const flowerContainer = document.getElementById("flowerContainer");

const envelopeSection = document.getElementById("envelopeSection");

const envelope = document.getElementById("envelope");

const letterSection = document.getElementById("letterSection");

const letterCard = document.getElementById("letterCard");


let opened = false;





// =========================
// FLOWERS
// =========================


const flowerImages = [

"F1.png",
"F2.png",
"F3.png",
"F4.png",
"F5.png",
"F6.png",
"F7.png",
"F8.png",
"F9.png",
"F10.png",
"F11.png"

];






// =========================
// SPARKLES
// =========================


function sparkles(x,y){


for(let i=0;i<40;i++){


let s=document.createElement("div");


s.style.position="fixed";

s.style.left=x+"px";

s.style.top=y+"px";


s.style.width="6px";

s.style.height="6px";


s.style.background="white";


s.style.borderRadius="50%";


s.style.boxShadow="0 0 15px white";


s.style.zIndex="200";


document.body.appendChild(s);



let angle=Math.random()*Math.PI*2;

let distance=80+Math.random()*150;



requestAnimationFrame(()=>{


s.style.transition="1s";


s.style.transform=
`
translate(
${Math.cos(angle)*distance}px,
${Math.sin(angle)*distance}px
)
`;


s.style.opacity="0";


});



setTimeout(()=>{

s.remove();

},1000);



}


}







// =========================
// FLOWER EXPLOSION FROM BOX
// =========================


function flowerExplosion(){


const rect =
giftBox.getBoundingClientRect();



const startX =
rect.left + rect.width/2;


const startY =
rect.top + rect.height*0.15;



for(let i=0;i<180;i++){



let flower=document.createElement("img");


flower.className="flower";


flower.src=
flowerImages[
Math.floor(Math.random()*flowerImages.length)
];



flower.style.left=startX+"px";

flower.style.top=startY+"px";



let size=
30+Math.random()*80;


flower.style.width=size+"px";



flowerContainer.appendChild(flower);



let angle=
Math.random()*Math.PI*2;



let distance=
300+Math.random()*800;



let x=
Math.cos(angle)*distance;



let y=
Math.sin(angle)*distance;



requestAnimationFrame(()=>{


flower.style.transition=

`
transform 2.8s cubic-bezier(.18,.89,.32,1.28),
opacity .8s
`;



flower.style.transform=

`
translate(${x}px,${y}px)
rotate(${Math.random()*720}deg)
scale(${1.5+Math.random()})
`;



flower.style.opacity="1";



});



setTimeout(()=>{


flower.style.opacity="0";


},3500);



setTimeout(()=>{


flower.remove();


},4500);



}


}








// =========================
// CLICK GIFT
// =========================


giftBox.addEventListener("click",()=>{


if(opened)return;


opened=true;



giftBox.src="giftboxopen.png";



const rect =
giftBox.getBoundingClientRect();



sparkles(

rect.left+rect.width/2,

rect.top+rect.height/2

);



flowerExplosion();





setTimeout(()=>{


giftSection.style.transition="1s";


giftSection.style.opacity="0";


giftSection.style.transform=
"translate(-50%,-50%) scale(.3)";



},3500);





setTimeout(()=>{


giftSection.style.display="none";



envelopeSection.style.display="flex";



setTimeout(()=>{


envelopeSection.style.opacity="1";


},100);



},4500);



});








// =========================
// OPEN ENVELOPE
// =========================


envelope.addEventListener("click",()=>{


envelope.style.transition="1s";


envelope.style.transform=
"scale(.2) rotate(25deg)";


envelope.style.opacity="0";



setTimeout(()=>{


envelopeSection.style.display="none";


letterSection.style.display="flex";



setTimeout(()=>{


letterSection.style.opacity="1";


letterCard.classList.add("show");



},100);



},900);



});





</script>

</body>
</html>
